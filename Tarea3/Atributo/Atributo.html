<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Atributo ejercicio</title>
</head>
<body>

    <div data-widget-name="Menu">Este es mi elemento</div>

    <script>

        let componente = document.querySelector("[data-widget-name]");

        let util = componente.getAttribute("data-widget-name");

        document.write(util);

    </script>

</body>
</html>
