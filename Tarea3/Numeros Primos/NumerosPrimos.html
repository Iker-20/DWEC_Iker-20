<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calcular Numeros Primos</title>

    <style>
        table{
            border-collapse: collapse;
            margin-top: 20px;
        }

        td{
            border: 1px solid black;
            padding: 12px 20px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Numeros Primos</h1>

    <label>Introduce un numero:</label>
    <input type="number" id="numero">

    <button onclick="numerosPrimos()">Mostrar Primos</button>

    <div id="respuesta"></div>

    <script>

        function numerosPrimos(){
            
            let numero = parseInt(document.getElementById("numero").value);   

            let tabla = "<table>";
            tabla += "<tr>";  

            for (let i = 1; i <= numero; i++){  

                let esPrimo = true; 

                for (let j = 2; j < i; j++){

                    if (i % j == 0){
                        esPrimo = false;
                    }
                }

                if (esPrimo){

                    tabla += "<td>" + i + "</td>"; 
                }
            }
 
            tabla += "</tr>";
            tabla += "</table>";
            
            document.getElementById("respuesta").innerHTML = tabla; 
        }
    </script>

</body>
</html>
